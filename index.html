<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Rozkłady GZM</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .tile { 
            background: white; border-radius: 12px; padding: 20px; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-decoration: none; color: #333;
        }
        .stop-info { display: flex; flex-direction: column; }
        .name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .realtime { color: #d32f2f; font-weight: bold; font-size: 18px; text-align: right; }
        .line { background: #ffcc00; padding: 2px 6px; border-radius: 4px; font-size: 14px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="grid">
        <a href="https://rj.transportgzm.pl/v2/rozklady/przystanek/stop/723/" class="tile">
            <div class="stop-info">
                <span class="name">Granica → Knurów</span>
                <small>Kliknij po pełny rozkład</small>
            </div>
            <div class="realtime" id="val-723">...</div>
        </a>
        <a href="https://rj.transportgzm.pl/v2/rozklady/przystanek/stop/724/" class="tile">
            <div class="stop-info">
                <span class="name">Granica → Szkoła</span>
            </div>
            <div class="realtime" id="val-724">...</div>
        </a>
        <a href="https://rj.transportgzm.pl/v2/rozklady/przystanek/stop/725/" class="tile">
            <div class="stop-info">
                <span class="name">Szkoła → Dom</span>
            </div>
            <div class="realtime" id="val-725">...</div>
        </a>
        <a href="https://rj.transportgzm.pl/v2/rozklady/przystanek/stop/3704/" class="tile">
            <div class="stop-info">
                <span class="name">Poczta → Dom</span>
            </div>
            <div class="realtime" id="val-3704">...</div>
        </a>
    </div>

    <script>
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbwMPI5S4T7QVtQY2akxZYSnc584uHTYL3l0wvIM1ZcIgmQ4wxpiu9DQnm5iSg6Rv9E/exec';
        const stops = ['723', '724', '725', '3704'];

        async function refreshData() {
            stops.forEach(async (id) => {
                try {
                    const response = await fetch(`${scriptUrl}?stopId=${id}`);
                    const data = await response.json();
                    document.getElementById(`val-${id}`).innerHTML = 
                        `<span class="line">${data.line}</span> ${data.time}`;
                } catch (e) {
                    document.getElementById(`val-${id}`).innerText = '--';
                }
            });
        }

        refreshData();
        setInterval(refreshData, 30000); // Odświeżaj co 30 sekund
    </script>
</body>
</html>
